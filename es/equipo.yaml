    nombre: Francisco Barbosa Delgado
    cargo: Socio fundador
    resena: Coordina el criterio institucional de las cuatro áreas de práctica de la firma.
    foto:
      archivo: assets/img/3.webp
      alt: Retrato del Dr. Francisco Barbosa Delgado
      encuadre: derecha

