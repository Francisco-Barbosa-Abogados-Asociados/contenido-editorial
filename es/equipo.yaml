# El equipo de la firma, en el orden en que aparece en el carrusel.
#
# PARA PUBLICAR UN ABOGADO: sustituye PENDIENTE por el texto real. Nada más.
# No hay que tocar HTML ni CSS: la ficha se dibuja sola a partir de esto.
#
# PARA AÑADIR UNO NUEVO: copia un bloque entero —desde el guion hasta la última
# línea indentada— y cámbiale el `id`, que tiene que ser distinto de todos los
# demás. Aparecerá en el carrusel al regenerar el sitio.
#
# PARA AÑADIR UNA FOTOGRAFÍA: deja el archivo en `public/assets/img/` y añade el
# bloque `foto` con la ruta, el texto alternativo (lo lee quien no ve la imagen:
# describe a la persona) y el encuadre — `centro` o `derecha`. Mientras no haya
# `foto`, la ficha muestra el marco con el icono y el rótulo «Fotografía
# pendiente», que es como está pensado el diseño: no es un error.
#
# EL ORDEN DE ESTA LISTA ES EL ORDEN DEL CARRUSEL. El fundador va primero.
#
# LA LISTA VA DENTRO DE `miembros:`, Y NO ES DECORATIVO. El panel de contenido
# (Decap) modela este archivo como un objeto con un campo declarado, y ese campo
# se llama `miembros` en `public/admin/config.yml`. Sin la clave, el formulario
# del panel abre VACÍO —cero integrantes donde hay ocho abogados— y guardarlo
# borra la lista entera. Todo lo de abajo va sangrado dos espacios por eso.

miembros:
