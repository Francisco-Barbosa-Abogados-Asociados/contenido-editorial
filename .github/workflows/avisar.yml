# Avisa al sitio de que hay contenido nuevo aprobado.
#
# ES LA BISAGRA DE TODO EL FLUJO EDITORIAL, y son veinte líneas.
#
# El contenido vive aquí y el código que sabe compilarlo vive en otro
# repositorio. Sin este aviso, aprobar una publicación la guardaría en `main` y
# el sitio no se enteraría: el editor vería su texto aprobado y la página sin
# cambiar, que es exactamente el fallo que el Escenario 2 existe para impedir
# —«se dispara la recompilación y el contenido aparece en el sitio sin
# intervención técnica»—.
#
# Se dispara al fusionar en `main`, que es lo que hace un administrador cuando
# aprueba desde el panel.
#
# ══════════════════════════════════════════════════════════════════════════
# EL TESTIGO
# ══════════════════════════════════════════════════════════════════════════
#
# `TESTIGO_SITIO` necesita permiso para lanzar eventos en el repositorio del
# sitio. Es el mismo secreto que usa `verificar.yml` para traer el código.
#
# Lo que NO puede hacer este flujo es desplegar por su cuenta: no tiene la
# credencial de Firebase para producción. Esto solo llama a la puerta; quien
# despliega es `desplegar.yml`, en el repositorio del sitio, que es donde vive
# esa decisión.

name: avisar

on:
  push:
    branches: [main]

concurrency:
  group: avisar
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  avisar:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Pedir al sitio que se vuelva a publicar
        env:
          GH_TOKEN: ${{ secrets.TESTIGO_SITIO }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "Falta el secreto TESTIGO_SITIO: el sitio no se enterará de este cambio." >&2
            echo "Ver CMS-EDITORIAL.md en el repositorio del sitio." >&2
            exit 1
          fi

          gh api repos/YouthDaconer/landing-barbosa-abogados/dispatches \
            --method POST \
            --field event_type=contenido-aprobado \
            --field 'client_payload[commit]=${{ github.sha }}' \
            --field 'client_payload[mensaje]=${{ github.event.head_commit.message }}'

          echo "Aviso enviado. El sitio tarda unos minutos en actualizarse."
